<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title-8 desc-8"><title id="title-8">Sekiz dış paletin örnek sefer karşılığı</title><desc id="desc-8">Marmara, Anadolu ve Başkent rezervasyonlarının örnek tutarları toplam 8.800 TL brüt rezervasyon tutarı oluşturuyor ve planlanan doluluk 25’ten 33 palete çıkıyor. Tutarlar kurgusal plan değerleridir; canlı dinamik fiyatlar farklılaşabilir ve net katkı hesabı için gerçekleşen maliyetler gerekir.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F5F0" stroke="none" stroke-width="1"/><rect x="64" y="45" width="18" height="18" rx="4" fill="#2FD39A" stroke="none" stroke-width="1"/><text x="92" y="62" fill="#0B1A4A" font-size="23" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="start">CargoPact</text><text x="1216" y="60" fill="#5B6275" font-size="14" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">İŞ ETKİSİ</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#E6DDCB" stroke-width="1"/><text x="1216" y="680" fill="#5B6275" font-size="14" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="end">08 / 09</text><text x="64" y="164" fill="#0B1A4A" font-size="50" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">Sekiz dış paletin</text><text x="64" y="220" fill="#0B1A4A" font-size="50" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">örnek sefer karşılığı.</text><text x="64" y="394" fill="#2547E0" font-size="82" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">8.800 TL</text><text x="69" y="438" fill="#2B3145" font-size="24" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">brüt rezervasyon tutarı</text><text x="69" y="473" fill="#5B6275" font-size="18" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Kurgusal plan değerleri</text><line x1="64" y1="518" x2="570" y2="518" stroke="#E6DDCB" stroke-width="1"/><text x="64" y="575" fill="#0B1A4A" font-size="42" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">33 / 33</text><text x="64" y="611" fill="#5B6275" font-size="18" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">planlanan doluluk</text><text x="356" y="575" fill="#0B1A4A" font-size="38" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">4.600 kg</text><text x="356" y="611" fill="#5B6275" font-size="18" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">dış yük ağırlığı</text><rect x="640" y="224" width="576" height="370" rx="20" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><text x="669" y="269" fill="#5B6275" font-size="17" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">Müşteri</text><text x="1000" y="269" fill="#5B6275" font-size="17" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">Palet</text><text x="1184" y="269" fill="#5B6275" font-size="17" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">Tutar</text><line x1="668" y1="289" x2="1188" y2="289" stroke="#E6DDCB" stroke-width="1"/><text x="669" y="333" fill="#0B1A4A" font-size="21" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">Marmara Ambar</text><text x="1000" y="333" fill="#0B1A4A" font-size="21" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">3</text><text x="1184" y="333" fill="#0B1A4A" font-size="21" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="end">3.750 TL</text><line x1="668" y1="358" x2="1188" y2="358" stroke="#E6DDCB" stroke-width="1"/><text x="669" y="400" fill="#0B1A4A" font-size="21" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">Anadolu Parsiyel</text><text x="1000" y="400" fill="#0B1A4A" font-size="21" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">2</text><text x="1184" y="400" fill="#0B1A4A" font-size="21" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="end">2.200 TL</text><line x1="668" y1="425" x2="1188" y2="425" stroke="#E6DDCB" stroke-width="1"/><text x="669" y="467" fill="#0B1A4A" font-size="21" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">Başkent Nakliye</text><text x="1000" y="467" fill="#0B1A4A" font-size="21" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">3</text><text x="1184" y="467" fill="#0B1A4A" font-size="21" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="end">2.850 TL</text><line x1="668" y1="492" x2="1188" y2="492" stroke="#E6DDCB" stroke-width="1"/><rect x="640" y="509" width="576" height="85" rx="0" fill="#E7ECFF" stroke="none" stroke-width="1"/><text x="669" y="560" fill="#13277A" font-size="22" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Toplam</text><text x="1000" y="560" fill="#13277A" font-size="22" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="end">8</text><text x="1184" y="560" fill="#13277A" font-size="25" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="end">8.800 TL</text><text x="64" y="659" fill="#5B6275" font-size="17" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Canlı dinamik fiyatlar farklılaşabilir; net katkı hesabı için gerçekleşen maliyetler gerekir.</text></svg>
