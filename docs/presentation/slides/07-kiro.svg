<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title-7 desc-7"><title id="title-7">Ortak bağlamdan izlenebilir görevlere</title><desc id="desc-7">Repoda steering bilgi tabanı ve yedi spec klasörü bulunuyor; gereksinim, tasarım ve görev belgeleri ürün kurallarını teknik uygulamaya bağlıyor. Paralel ajan kullanımı ekibin geliştirme kaydında anlatılıyor; bu süreç tamamlanmış işlerin ve açık görevlerin durumuyla birlikte izleniyor.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F5F0" stroke="none" stroke-width="1"/><rect x="64" y="45" width="18" height="18" rx="4" fill="#2FD39A" stroke="none" stroke-width="1"/><text x="92" y="62" fill="#0B1A4A" font-size="23" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="start">CargoPact</text><text x="1216" y="60" fill="#5B6275" font-size="14" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">KIRO İLE GELİŞTİRME</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#E6DDCB" stroke-width="1"/><text x="1216" y="680" fill="#5B6275" font-size="14" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="end">07 / 09</text><text x="64" y="165" fill="#0B1A4A" font-size="46" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">Ortak bağlamdan izlenebilir görevlere.</text><rect x="64" y="220" width="1152" height="83" rx="18" fill="#0B1A4A" stroke="none" stroke-width="1"/><text x="92" y="269" fill="#FFFFFF" font-size="26" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Steering bilgi tabanı</text><text x="441" y="269" fill="#E3FAF1" font-size="21" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Ürün bağlamı · operasyon kuralları · tasarım kararları</text><rect x="64" y="351" width="360" height="138" rx="18" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><rect x="89" y="377" width="35" height="42" rx="4" fill="#E7