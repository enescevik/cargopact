 fill="#FFFFFF" font-size="22" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="middle">kazanan</text><text x="106" y="489" fill="#FFFFFF" font-size="24" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">6 eşzamanlı istek</text><text x="106" y="526" fill="#E3FAF1" font-size="19" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">5 istek kapasite sınırında reddedilir</text><rect x="806" y="224" width="410" height="172" rx="20" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><text x="838" y="307" fill="#2547E0" font-size="66" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">55 / 55</text><text x="839" y="351" fill="#5B6275" font-size="20" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Uçtan uca test • ekip beyanı</text><text x="820" y="445" fill="#0B1A4A" font-size="24" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Kiracı izolasyonu</text><text x="820" y="478" fill="#5B6275" font-size="18" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Firma verisi üyelik sınırında.</text><text x="820" y="528" fill="#0B1A4A" font-size="24" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Idempotency</text><text x="820" y="561" fill="#5B6275" font-size="18" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Tekrarlanan istekte tek işlem.</text><line x1="64" y1="603" x2="1216" y2="603" stroke="#E6DDCB" stroke-width="1"/><text x="64" y="639" fill="#5B6275" font-size="17" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">6→1: test kodu + ekip kaydı  ·  55/55: ham başarı kaydı görülmedi</text><text x="64" y="673" fill="#5B6275" font-size="14" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Görülen CI kaydı: 36 birim testi; typecheck, build ve synth başarılı.</text></svg>
