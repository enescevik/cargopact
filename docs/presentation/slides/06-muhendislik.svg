<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title-6 desc-6"><title id="title-6">Aynı kapasiteyi iki kez satma</title><desc id="desc-6">DSQL test kodu altı eşzamanlı istekte bir kazananı ve beş kapasite reddini doğruluyor; PROGRESS kaydı bu grubun 4/4 geçtiğini bildiriyor. 55/55 uçtan uca başarı ekip beyanı olarak gösteriliyor; ilgili smoke betiği bulundu, ancak ham başarı kaydı görülmedi ve canlı testler bu çalışmada yeniden çalıştırılmadı.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F5F0" stroke="none" stroke-width="1"/><rect x="64" y="45" width="18" height="18" rx="4" fill="#2FD39A" stroke="none" stroke-width="1"/><text x="92" y="62" fill="#0B1A4A" font-size="23" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="start">CargoPact</text><text x="1216" y="60" fill="#5B6275" font-size="14" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">MÜHENDİSLİK KALİTESİ</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#E6DDCB" stroke-width="1"/><text x="1216" y="680" fill="#5B6275" font-size="14" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="end">06 / 09</text><text x="64" y="165" fill="#0B1A4A" font-size="51" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">Aynı kapasiteyi iki kez satma.</text><rect x="64" y="224" width="710" height="342" rx="24" fill="#0B1A4A" stroke="none" stroke-width="1"/><text x="97" y="267" fill="#E3FAF1" font-size="14" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">GERÇEK VERİTABANI YARIŞ TESTİ</text><rect x="105" y="315" width="42" height="42" rx="10" fill="#13277A" stroke="#7184C3" stroke-width="1"/><text x="126" y="342" fill="#FFFFFF" font-size="16" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="middle">1</text><rect x="165" y="315" width="42" height="42" rx="10" fill="#13277A" stroke="#7184C3" stroke-widt