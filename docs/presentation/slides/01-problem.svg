<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title-1 desc-1"><title id="title-1">Boş kapasite, kaçan gelir alanı</title><desc id="desc-1">Bu şema, 33 pozisyonlu bir araçta 25 iç palet bulunan kurgusal demo seferini gösteriyor. CargoPact’in hedefi, kalan sekiz pozisyonu taşıyıcının operasyon sınırları içinde müşterilere görünür ve rezervasyon yapılabilir hale getirmek.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F5F0" stroke="none" stroke-width="1"/><rect x="64" y="45" width="18" height="18" rx="4" fill="#2FD39A" stroke="none" stroke-width="1"/><text x="92" y="62" fill="#0B1A4A" font-size="23" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="start">CargoPact</text><text x="1216" y="60" fill="#5B6275" font-size="14" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">PROBLEM</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#E6DDCB" stroke-width="1"/><text x="1216" y="680" fill="#5B6275" font-size="14" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="end">01 / 09</text><text x="64" y="176" fill="#0B1A4A" font-size="52" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">Boş kalan kapasite,</text><text x="64" y="234.24" fill="#0B1A4A" font-size="52" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">yeni bir gelir alanı.</text><text x="66" y="338" fill="#5B6275" font-size="22" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Planlı depo transferleri, kullanılmayan</text><text x="66" y="371" fill="#5B6275" font-size="22" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">palet alanıyla yola çıkabilir.</text><text x="64" y="515" fill="#2547E0" font-size="112" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">8</text><text x="156" y="458" fill="#0B1A4A" font-size="25" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">satışa açık</text><text x="156" y="491.75" fill="#0B1A4A" font-size="25" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">palet pozisyonu</text><line x1="64" y1="557" x2="550" y2="557" stroke="#E6DDCB" stroke-width="1"/><text x="64" y="598" fill="#2B3145" font-size="21" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">25 iç palet  /  33 toplam pozisyon</text><text x="64" y="636" fill="#5B6275" font-size="15" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Kurgusal demo seferi • planlanan doluluk</text><rect x="632" y="128" width="584" height="500" rx="24" fill="#0B1A4A" stroke="none" stroke-width="1"/><text x="666" y="182" fill="#FFFFFF" font-size="35" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">Gebze → Ankara</text><text x="666" y="218" fill="#E3FAF1" font-size="17" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Transfer Merkezi → Dağıtım Merkezi</text><rect x="666" y="264" width="39" height="56" rx="7" fill="#C6CCDA" stroke="none" stroke-width="1"/><text x="685.5" y="296" fill="#2B3145" font-size="12" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">İÇ</text><line x1="672" y1="308" x2="699" y2="308" stroke="#747E96" stroke-width="1.5"/><rect x="713" y="264" width="39" height="56" rx="7" fill="#C6CCDA" stroke="none" stroke-width="1"/><text x="732.5" y="296" fill="#2B3145" font-size="12" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">İÇ</text><line x1="719" y1="308" x2="746" y2="308" stroke="#747E96" stroke-width="1.5"/><rect x="760" y="264" width="39" height="56" rx="7" fill="#C6CCDA" stroke="none" stroke-width="1"/><text x="779.5" y="296" fill="#2B3145" font-size="12" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">İÇ</text><line x1="766" y1="308" x2="793" y2="308" str