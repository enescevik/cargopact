<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title-5 desc-5"><title id="title-5">İş kuralları API'de, ortak bağlam ajanlarda</title><desc id="desc-5">Mimari görünüm, repodaki CDK ve ajan kaynaklarından arayüz, kimlik, iş akışı, veri ve ajan sorumluluklarını özetliyor. Cognito, API Gateway, Lambda ve Aurora DSQL temel işlem akışını; S3 ve CloudFront arayüz ile belge katmanını; AgentCore ve Strands ajan iş akışını oluşturuyor, ancak canlı AWS çalıştırması bu sunum çalışmasında yeniden doğrulanmadı.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F5F0" stroke="none" stroke-width="1"/><rect x="64" y="45" width="18" height="18" rx="4" fill="#2FD39A" stroke="none" stroke-width="1"/><text x="92" y="62" fill="#0B1A4A" font-size="23" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="start">CargoPact</text><text x="1216" y="60" fill="#5B6275" font-size="14" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">MİMARİ</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#E6DDCB" stroke-width="1"/><text x="1216" y="680" fill="#5B6275" font-size="14" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="end">05 / 09</text><text x="64" y="165" fill="#0B1A4A" font-size="47" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">İş kuralları API’de, bağlam ajanlarda.</text><rect x="64" y="229" width="216" height="102" rx="16" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><text x="86" y="267" fill="#0B1A4A" font-size="23" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Web + mobil</text><text x="86" y="298" fill="#5B6275" font-size="16" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">React · Expo</text><rect x="366" y="229" width="216" height="102" rx="16" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><text x="388" y="267" fill="#0B1A4A" font-size="23" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">API Gateway</text><text x="388" y="298" fill="#5B6275" font-size="16" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">JWT yetkilendirmesi</text><rect x="668" y="229" width="216" height="102" rx="16" fill="#0B1A4A" stroke="none" stroke-width="1"/><text x="690" y="267" fill="#FFFFFF" font-size="23" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Lambda</text><text x="690" y="298" fill="#E3FAF1" font-size="16" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">İş API’si + sohbet</text><rect x="970" y="229" width="246" height="102" rx="16" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><text x="992" y="267" fill="#0B1A4A" font-size="23" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Aurora DSQL</text><text x="992" y="298" fill="#5B6275" font-size="16" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Rezervasyon verisi</text><line x1="282" y1="280" x2="358" y2="280" stroke="#2547E0" stroke-width="2"/><path d="M 351 275 L 358 280 L 351 285" fill="none" stroke="#2547E0" stroke-width="2"/><line x1="584" y1="280" x2="660" y2="280" stroke="#2547E0" stroke-width="2"/><path d="M 653 275 L 660 280 L 653 285" fill="none" stroke="#2547E0" stroke-width="2"/><line x1="886" y1="280" x2="962" y2="280" stroke="#2547E0" stroke-width="2"/><path d="M 955 275 L 962 280 L 955 285" fill="none" stroke="#2547E0" stroke-width="2"/><rect x="64" y="410" width="244" height="102" rx="16" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><text x="86" y="448" fill="#0B1A4A" font-size="23" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">CloudFront + S3</text><text x="86" y="479" fill="#5B6275" font-size="16" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Arayüz dağıtımı</text><rect x="354" y="410" width="210" height="102" rx="16" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><text x="376" y="448" fill="#0B1A4A" font-size="23" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Cognito</text><text x="376" y="479" fill="#5B6275" font-size="16" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Kimlik doğrulama</text><rect x="612" y="410" width="326" height="102" rx="16" fill="#E7ECFF" stroke="none" stroke-width="1"/><text x="634" y="448" fill="#0B1A4A" font-size="23" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">AgentCore + Strands</text><text x="634" y="479" fill="#5B6275" font-size="16" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Orkestratör ve uzman ajanlar</text><rect x="984" y="410" width="232" height="102" rx="16" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><text x="1006" y="448" fill="#0B1A4A" font-size="23" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">S3</text><text x="1006" y="479" fill="#5B6275" font-size="16" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Fotoğraf / e-POD</text><line x1="172" y1="331" x2="172" y2="402" stroke="#5B6275" stroke-width="1.5"/><line x1="474" y1="331" x2="474" y2="402" stroke="#5B6275" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="776" y1="331" x2="776" y2="402" stroke="#2547E0" stroke-width="2"/><path d="M 771 395 L 776 402 L 781 395" fill="none" stroke="#2547E0" stroke-width="2"/><line x1="844" y1="331" x2="844" y2="365" stroke="#2547E0" stroke-width="2"/><line x1="844" y1="365" x2="1100" y2="365" stroke="#2547E0" stroke-width="2"/><line x1="1100" y1="365" x2="1100" y2="402" stroke="#2547E0" stroke-width="2"/><path d="M 1095 395 L 1100 402 L 1105 395" fill="none" stroke="#2547E0" stroke-width="2"/><rect x="64" y="555" width="1152" height="65" rx="14" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><text x="89" y="596" fill="#2547E0" font-size="23" font-w