<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title-2 desc-2"><title id="title-2">Kapasiteyi görünür, akışı izlenebilir kıl</title><desc id="desc-2">Taşıyıcı satışa açacağı palet, ağırlık ve hacim sınırlarını belirler; müşteri uygun seferde rezervasyon oluşturur. Müşteri yükünü çıkış deposuna getirir, varışta kendisi veya yetkili alıcısı depodan teslim alır; kapıdan alım ve kapıya teslim bu akışın kapsamında değildir.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F5F0" stroke="none" stroke-width="1"/><rect x="64" y="45" width="18" height="18" rx="4" fill="#2FD39A" stroke="none" stroke-width="1"/><text x="92" y="62" fill="#0B1A4A" font-size="23" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="start">CargoPact</text><text x="1216" y="60" fill="#5B6275" font-size="14" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">ÇÖZÜM</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#E6DDCB" stroke-width="1"/><text x="1216" y="680" fill="#5B6275" font-size="14" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="end">02 / 09</text><text x="64" y="165" fill="#0B1A4A" font-size="50" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">Kapasiteyi görünür,</text><text x="64" y="221" fill="#0B1A4A" font-size="50" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">akışı izlenebilir kıl.</text><circle cx="89" cy="318" r="25" fill="#E7ECFF" stroke="none" stroke-width="1"/><text x="89" y="325" fill="#2547E0" font-size="16" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">01</text><text x="64" y="385" fill="#0B1A4A" font-size="25" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Kapasiteyi yayınla</text><text x="64" y="422" fill="#2547E0" font-size="17" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Taşıyıcı</text><text x="64" y="460" fill="#5B6275" font-size="17" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Palet, kg ve m³ sınırlarını aç.</text><line x1="146" y1="318" x2="409" y2="318" stroke="#E6DDCB" stroke-width="2"/><path d="M 402 313 L 409 318 L 402 323" fill="none" stroke="#E6DDCB" stroke-width="2"/><circle cx="481" cy="318" r="25" fill="#2547E0" stroke="none" stroke-width="1"/><text x="481" y="325" fill="#FFFFFF" font-size="16" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">02</text><text x="456" y="385" fill="#0B1A4A" font-size="25" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Uygun seferde yer ayır</text><text x="456" y="422" fill="#2547E0" font-size="17" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Müşteri</text><text x="456" y="460" fill="#5B6275" font-size="17" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Teklif, ödeme ve taşıyıcı onayı.</text><line x1="538" y1="318" x2="801" y2="318" stroke="#E6DDCB" stroke-width="2"/><path d="M 794 313 L 801 318 L 794 323" fill="none" stroke="#E6DDCB" stroke-width="2"/><circle cx="873" cy="318" r="25" fill="#E7ECFF" stroke="none" stroke-width="1"/><text x="873" y="325" fill="#2547E0" font-size="16" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">03</text><text x="848" y="385" fill="#0B1A4A" font-size="25" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Depodan depoya izle</text><text x="848" y="422" fill="#2547E0" font-size="17" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Depo</text><text x="848" y="460" fill="#5B6275" font-size="17" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">QR kabul, yükleme ve e-POD.</text><rect x="64" y="516" width="1152" height="117" rx="18" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><circle cx="102" cy="558" r="7" fill="#2547E0" stroke="none" stroke-width="1"/><line x1="110" y1="558" x2="1159" y2="558" stroke="#E6DDCB" stroke-width="2"/><circle cx="1170" cy="558" r="7" fill="#2FD39A" stroke="none" stroke-width="1"/><text x="98" y="588" fill="#0B1A4A" font-size="23" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">Gebze Transfer Merkezi</text><text x="1180" y="588" fill="#0B1A4A" font-size="23" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="end">Ankara Dağıtım Merkezi</text><text x="98" y="615" fill="#5B6275" font-size="16" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Müşteri yükünü depoya getirir</text><text x="1180" y="615" fill="#5B6275" font-size="16" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="end">Yetkili alıcı depodan teslim alır</text></svg>
