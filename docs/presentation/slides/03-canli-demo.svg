<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">25/33'ten tam doluluğa, sınırları koruyarak</title><desc id="desc-3">Marmara’nın üç, Anadolu’nun iki paletiyle planlanan doluluk 30’a çıkar; Başkent’in ilk talebi dış yükü 5.300 kilograma çıkaracağı için reddedilir. Başkent talebini 1.900 kilograma revize ettiğinde toplam dış yük 4.600 kilogram olur ve araç 33 planlanan palete ulaşır.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F5F0" stroke="none" stroke-width="1"/><rect x="64" y="45" width="18" height="18" rx="4" fill="#2FD39A" stroke="none" stroke-width="1"/><text x="92" y="62" fill="#0B1A4A" font-size="23" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="start">CargoPact</text><text x="1216" y="60" fill="#5B6275" font-size="14" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">CANLI DEMO AKIŞI</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#E6DDCB" stroke-width="1"/><text x="1216" y="680" fill="#5B6275" font-size="14" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="end">03 / 09</text><text x="64" y="165" fill="#0B1A4A" font-size="52" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">25/33’ten tam doluluğa.</text><text x="64" y="209" fill="#5B6275" font-size="23" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Palet alanı uygun olsa bile ağırlık sınırı aşılmaz.</text><rect x="64" y="260" width="216" height="276" rx="18" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><text x="84" y="302" fill="#5B6275" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">BAŞLANGIÇ</text><text x="84" y="367" fill="#0B1A4A" font-size="42" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">25/33</text><text x="84" y="414" fill="#0B1A4A" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">İç yük</text><text x="84" y="454" fill="#5B6275" font-size="15" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">8 pozisyon açık</text><text x="84" y="496" fill="#2547E0" font-size="18" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">0 kg dış yük</text><line x1="283" y1="370" x2="295" y2="370" stroke="#5B6275" stroke-width="1.5"/><path d="M 288 365 L 295 370 L 288 375" fill="none" stroke="#5B6275" stroke-width="1.5"/><rect x="298" y="260" width="216" height="276" rx="18" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><text x="318" y="302" fill="#5B6275" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">ONAYLI</text><text x="318" y="367" fill="#0B1A4A" font-size="42" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">28/33</text><text x="318" y="414" fill="#0B1A4A" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Marmara Ambar</text><text x="318" y="454" fill="#5B6275" font-size="15" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">+3 palet · 1.500 kg</text><text x="318" y="496" fill="#2547E0" font-size="18" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">3.750 TL</text><line x1="517" y1="370" x2="529" y2="370" stroke="#5B6275" stroke-width="1.5"/><path d="M 522 365 L 529 370 L 522 375" fill="none" stroke="#5B6275" stroke-width="1.5"/><rect x="532" y="260" width="216" height="276" rx="18" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><text x="552" y="302" fill="#5B6275" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">ONAYLI</text><text x="552" y="367" fill="#0B1A4A" font-size="42" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">30/33</text><text x="552" y="414" fill="#0B1A4A" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Anadolu Parsiyel</text><text x="552" y="454" fill="#5B6275" font-size="15" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">+2 palet · 1.200 kg</text><text x="552" y="496" fill="#2547E0" font-size="18" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">2.200 TL</text><line x1="751" y1="370" x2="763" y2="370" stroke="#5B6275" stroke-width="1.5"/><path d="M 756 365 L 763 370 L 756 375" fill="none" stroke="#5B6275" stroke-width="1.5"/><rect x="766" y="260" width="216" height="276" rx="18" fill="#FBE9E7" stroke="#E7B9B4" stroke-width="1"/><text x="786" y="302" fill="#8F241C" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">REDDEDİLDİ</text><text x="786" y="367" fill="#0B1A4A" font-size="42" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">30/33</text><text x="786" y="414" fill="#0B1A4A" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Başkent ilk talep</text><text x="786" y="454" fill="#8F241C" font-size="15" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">+3 palet · 2.600 kg</text><text x="786" y="496" fill="#8F241C" font-size="18" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">5.300 &gt; 5.000 kg</text><line x1="985" y1="370" x2="997" y2="370" stroke="#5B6275" stroke-width="1.5"/><path d="M 990 365 L 997 370 L 990 375" fill="none" stroke="#5B6275" stroke-width="1.5"/><rect x="1000" y="260" width="216" height="276" rx="18" fill="#0B1A4A" stroke="none" stroke-width="1"/><text x="1020" y="302" fill="#2FD39A" font-size="13" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">ONAYLI</text><text x="1020" y="367" fill="#FFFFFF" font-size="42" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">33/33</text><text x="1020" y="414" fill="#FFFFFF" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Başkent revizesi</text><text x="1020" y="454" fill="#E3FAF1" font-size="15" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">+3 palet · 1.900 kg</text><text x="1020" y="496" fill="#FFFFFF" font-size="18" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="start">2.850 TL</text><line x1="64" y1="574" x2="1216" y2="574" stroke="#E6DDCB" stroke-width="1"/><text x="64" y="614" fill="#0B1A4A" font-size="25" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">8 / 8 dış palet</text><text x="438" y="614" fill="#0B1A4A" font-size="25" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">4.600 / 5.000 kg</text><text x="934" y="614" fill="#0B1A4A" font-size="25" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">12 m³ sınırı</text><text x="64" y="655" fill="#5B6275" font-size="15" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Planlanan doluluk • Ret sırasında kapasite artırılmaz; fiili yükleme ayrıca doğrulanır.</text></svg>
