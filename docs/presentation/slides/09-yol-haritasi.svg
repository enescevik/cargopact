<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title-9 desc-9"><title id="title-9">Gerçek operasyona bağlanan sonraki adımlar</title><desc id="desc-9">Bir sonraki kapsam, gerçek ödeme sağlayıcısıyla para akışını, TMS ve WMS entegrasyonlarıyla operasyon verisini birleştirmek. Taşıyıcıya özel bilgi tabanı da ajanın firma politikaları ve depo kurallarıyla çalışmasını sağlayacak; bu başlıklar henüz tarih veya teslim taahhüdü içermiyor.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#0B1A4A" stroke="none" stroke-width="1"/><rect x="64" y="45" width="18" height="18" rx="4" fill="#2FD39A" stroke="none" stroke-width="1"/><text x="92" y="62" fill="#FFFFFF" font-size="23" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="start">CargoPact</text><text x="1216" y="60" fill="#E3FAF1" font-size="14" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">YOL HARİTASI</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#405078" stroke-width="1"/><text x="1216" y="680" fill="#BFC9E6" font-size="14" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="end">09 / 09</text><text x="64" y="171" fill="#FFFFFF" font-size="56" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">Sıradaki adım:</text><text x="64" y="233.72" fill="#FFFFFF" font-size="56" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">gerçek operasyona bağlamak.</text><line x1="91" y1="356" x2="1135" y2="356" stroke="#405078" stroke-width="2"/><circle cx="91" cy="356" r="27" fill="#2FD39A" stroke="none" stroke-width="1"/><text x="91" y="363" fill="#0B1A4A" font-size="17" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">01</text><text x="64" y="442" fill="#FFFFFF" font-size="28" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Gerçek ödeme</text><text x="64" y="488" fill="#E3FAF1" font-size="21" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Tahsilat, iade ve</text><text x="64" y="518.45" fill="#E3FAF1" font-size="21" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">mutabakat akışı.</text><circle cx="487" cy="356" r="27" fill="#13277A" stroke="#7184C3" stroke-width="1"/><text x="487" y="363" fill="#FFFFFF" font-size="17" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">02</text><text x="460" y="442" fill="#FFFFFF" font-size="28" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">TMS / WMS</text><text x="460" y="488" fill="#E3FAF1" font-size="21" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Sefer ve depo verisinin</text><text x="460" y="518.45" fill="#E3FAF1" font-size="21" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">operasyona entegrasyonu.</text><circle cx="883" cy="356" r="27" fill="#13277A" stroke="#7184C3" stroke-width="1"/><text x="883" y="363" fill="#FFFFFF" font-size="17" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">03</text><text x="856" y="442" fill="#FFFFFF" font-size="28" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Taşıyıcı bilgi tabanı</text><text x="856" y="488" fill="#E3FAF1" font-size="21" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Firmaya özel politikalar,</text><text x="856" y="518.45" fill="#E3FAF1" font-size="21" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">depo kuralları ve belgeler.</text><line x1="64" y1="586" x2="1216" y2="586" stroke="#405078" stroke-width="1"/><text x="64" y="633" fill="#2FD39A" font-size="19" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Planlanan geliştirmeler</text><text x="1216" y="633" fill="#FFFFFF" font-size="32" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="end">CargoPact</text></svg>
