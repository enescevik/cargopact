<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title-4 desc-4"><title id="title-4">Zaman, kapasite ve fiyat aynı akışta</title><desc id="desc-4">Bu örnekte rezervasyon 15.00’te, çıkış deposu kabulü 17.00’de kapanır ve araç 18.00’de hareket eder; uygunluk palet, kilogram ve metreküp açısından birlikte kontrol edilir. Fiyat taban, talep ve zaman katsayılarıyla oluşur; doğrulanmış gelmeme geçmişi taşıyıcının öncelik değerlendirmesinde kullanılır ve müşteri ekranına açılmaz.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F5F0" stroke="none" stroke-width="1"/><rect x="64" y="45" width="18" height="18" rx="4" fill="#2FD39A" stroke="none" stroke-width="1"/><text x="92" y="62" fill="#0B1A4A" font-size="23" font-weight="700" font-family="Inter, Arial, sans-serif" text-anchor="start">CargoPact</text><text x="1216" y="60" fill="#5B6275" font-size="14" font-weight="500" font-family="Inter, Arial, sans-serif" text-anchor="end">NASIL ÇALIŞIR</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#E6DDCB" stroke-width="1"/><text x="1216" y="680" fill="#5B6275" font-size="14" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="end">04 / 09</text><text x="64" y="165" fill="#0B1A4A" font-size="47" font-weight="500" font-family="Fraunces, Georgia, serif" text-anchor="start">Zaman, kapasite ve fiyat aynı akışta.</text><line x1="96" y1="292" x2="1176" y2="292" stroke="#E6DDCB" stroke-width="3"/><text x="120" y="252" fill="#2547E0" font-size="38" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">15:00</text><circle cx="120" cy="292" r="10" fill="#2547E0" stroke="none" stroke-width="1"/><text x="120" y="334" fill="#0B1A4A" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">T−3</text><text x="120" y="365" fill="#5B6275" font-size="18" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="middle">Son rezervasyon</text><text x="660" y="252" fill="#2547E0" font-size="38" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">17:00</text><circle cx="660" cy="292" r="10" fill="#2547E0" stroke="none" stroke-width="1"/><text x="660" y="334" fill="#0B1A4A" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">T−1</text><text x="660" y="365" fill="#5B6275" font-size="18" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="middle">Çıkış deposu</text><text x="660" y="390" fill="#5B6275" font-size="18" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="middle">son kabul</text><text x="1150" y="252" fill="#2547E0" font-size="38" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">18:00</text><circle cx="1150" cy="292" r="10" fill="#2FD39A" stroke="none" stroke-width="1"/><text x="1150" y="334" fill="#0B1A4A" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">T</text><text x="1150" y="365" fill="#5B6275" font-size="18" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="middle">Kalkış</text><rect x="64" y="432" width="544" height="187" rx="18" fill="#FFFFFF" stroke="#E6DDCB" stroke-width="1"/><text x="90" y="472" fill="#0B1A4A" font-size="20" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Dinamik fiyat</text><text x="90" y="523" fill="#2547E0" font-size="30" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Taban × talep × zaman</text><text x="90" y="570" fill="#5B6275" font-size="18" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Süreli teklif, açık fiyat açıklaması.</text><text x="654" y="471" fill="#0B1A4A" font-size="21" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Uygunluk kontrolü</text><rect x="654" y="494" width="116" height="44" rx="12" fill="#E7ECFF" stroke="none" stroke-width="1"/><text x="712" y="523" fill="#13277A" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">Palet</text><rect x="786" y="494" width="100" height="44" rx="12" fill="#E7ECFF" stroke="none" stroke-width="1"/><text x="836" y="523" fill="#13277A" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">kg</text><rect x="902" y="494" width="100" height="44" rx="12" fill="#E7ECFF" stroke="none" stroke-width="1"/><text x="952" y="523" fill="#13277A" font-size="18" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="middle">m³</text><text x="654" y="575" fill="#0B1A4A" font-size="20" font-weight="600" font-family="Inter, Arial, sans-serif" text-anchor="start">Doğrulanmış gelmeme geçmişi</text><text x="654" y="609" fill="#5B6275" font-size="17" font-weight="400" font-family="Inter, Arial, sans-serif" text-anchor="start">Öncelik bilgisi yalnız taşıyıcı ekranında.</text></svg>
